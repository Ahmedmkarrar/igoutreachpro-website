name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          sleep 90
          URLS=$(curl -fsS https://www.igoutreachpro.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          BODY=$(jq -n --argjson urls "$URLS" '{host:"www.igoutreachpro.com",key:"c94d6db423fd2ad31a479822ae7a4574",keyLocation:"https://www.igoutreachpro.com/c94d6db423fd2ad31a479822ae7a4574.txt",urlList:$urls}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow HTTP $CODE for $(echo "$URLS" | jq length) URLs"
          test "$CODE" = 200 -o "$CODE" = 202
